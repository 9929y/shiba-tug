<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shiba Tug</title><link rel="stylesheet" href="styles.css?v=4"></head><body>
<main class="toy-shell"><section class="toy" aria-label="Shiba Tug">
<header class="game-header" id="breedHeader"><div></div><div class="breed-picker" role="group" aria-label="Choose your Shiba"><button class="breed selected" data-breed="yellow" aria-label="Golden Shiba" aria-pressed="true"><span class="breed-portrait yellow"></span></button><button class="breed" data-breed="black" aria-label="Black Shiba" aria-pressed="false"><span class="breed-portrait black"></span></button><span id="breedStatus" class="breed-status" role="status"></span></div></header>
<div class="stage" id="stage" data-state="loading" tabindex="0" role="group" aria-label="Leash: hold Left Arrow to pull, Right Arrow to relax, release to take a step" aria-describedby="instructions"><canvas id="scene" width="1536" height="512" role="img" aria-label="A Shiba Inu on a red leash"></canvas><svg class="hit-layer" viewBox="0 0 1536 512" preserveAspectRatio="none" aria-hidden="true"><path id="gripHit" class="rope-hit" d="M 250 240 L 480 330"/><path id="ropeHit" class="rope-hit" d="M315 240 Q700 430 1035 300"/></svg><div class="drag-guide" id="guide" aria-hidden="true">←</div><button id="loading" class="loading" type="button">Getting ready…</button></div>
<div id="route" class="route" aria-hidden="true"><svg class="route-paw" viewBox="0 0 24 24"><path d="M7 16c0-3 3-6 5-6s5 3 5 6-3 2-5 2-5 1-5-2Z"/><ellipse cx="5" cy="9" rx="2" ry="3"/><ellipse cx="10" cy="5" rx="2" ry="3"/><ellipse cx="16" cy="5" rx="2" ry="3"/><ellipse cx="20" cy="10" rx="2" ry="3"/></svg><span class="route-preview"></span><span class="route-line"></span></div><progress class="sr-only" id="walkProgress" max="100" value="0" aria-label="Progress home"></progress>
<p id="instructions" class="sr-only">Hold the hand or red leash and drag left. Release to take a step. A gentle pull goes further; pulling too far makes your Shiba resist. You can also use the arrow keys.</p><p id="message" class="sr-only" role="status" aria-live="polite"></p><button id="restart" class="restart" aria-label="Play again" hidden>↻</button>
</section></main><script src="mechanics.js?v=4"></script><script src="frames.js"></script><script src="black-frames.js"></script><script src="game.js?v=4"></script></body></html>
