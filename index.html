<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拉绳遛柴</title><link rel="stylesheet" href="styles.css?v=3"></head><body>
<main class="toy-shell"><section class="toy" aria-label="拉绳遛柴">
<header class="game-header"><div></div><div class="breed-picker" role="group" aria-label="选择柴犬"><button class="breed selected" data-breed="yellow" aria-label="黄柴" aria-pressed="true"><span class="breed-portrait yellow"></span></button><button class="breed" data-breed="black" aria-label="黑柴" aria-pressed="false"><span class="breed-portrait black"></span></button><span id="breedStatus" class="breed-status" role="status"></span></div></header>
<div class="stage" id="stage" data-state="loading" tabindex="0" role="group" aria-label="牵引绳，按住左方向键拉动，右方向键放松，松开结算" aria-describedby="instructions"><canvas id="scene" width="1536" height="512" role="img" aria-label="柴犬与红色牵引绳"></canvas><svg class="hit-layer" viewBox="0 0 1536 512" preserveAspectRatio="none" aria-hidden="true"><path id="ropeHit" class="rope-hit" d="M315 240 Q700 430 1035 300"/></svg><div class="drag-guide" id="guide" aria-hidden="true">←</div><button id="loading" class="loading" type="button">准备中…</button></div>
<div id="route" class="route" aria-hidden="true"><span class="route-preview"></span><span class="route-line"></span></div><progress class="sr-only" id="walkProgress" max="100" value="0" aria-label="回家进度"></progress>
<p id="instructions" class="sr-only">按住红色牵引绳向左拖动，松手迈步。适中拉动走得更远，拉得太远会撑住。也可用左右方向键。</p><p id="message" class="sr-only" role="status" aria-live="polite"></p><button id="restart" class="restart" aria-label="再走一圈" hidden>↻</button>
</section></main><script src="mechanics.js?v=3"></script><script src="frames.js"></script><script src="black-frames.js"></script><script src="game.js?v=3"></script></body></html>
