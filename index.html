<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>小柴的散步谈判</title><meta name="description" content="轻拉、观察、松绳。和一只倔柴，谈一场小小的散步。"><link rel="stylesheet" href="styles.css"></head>
<body>
<main class="toy-shell"><section class="toy" aria-label="小柴散步游戏">
<header class="game-header"><div><p class="eyebrow">SHIBA TUG · 小柴日常</p><h1>散步，也要商量。</h1></div><span class="edition">一场很小的冒险</span></header>
<div class="walk-heading"><span id="chapter">出门的第一步</span><span><b id="distance">0%</b> 的散步</span></div>
<div class="stage" id="stage" data-state="loading" data-chapter="1">
<img id="celCurrent" class="poster" src="assets/cels/frames/ch1-idle.webp" draggable="false" alt="一只黄柴站在红色牵引绳另一端，固执地等着你。">
<canvas id="scene" width="1536" height="512" hidden aria-hidden="true"></canvas>
<svg class="hit-layer" viewBox="0 0 1536 512" preserveAspectRatio="none" aria-hidden="true"><path id="ropeHit" class="rope-hit" d="M315 240 Q700 430 1035 300"/></svg>
<div id="grabCue" class="grab-cue" aria-hidden="true"><i></i></div>
<button id="loading" class="loading" type="button">小柴正在穿牵引绳…</button>
</div>
<div id="route" class="route" aria-hidden="true"><span class="route-line"></span><span class="route-stop">出门</span><span class="route-stop">闻闻</span><span class="route-stop">一起走</span></div>
<progress class="sr-only" id="walkProgress" max="100" value="0" aria-label="散步进度"></progress>
<div class="interaction"><div class="tension"><label id="tensionLabel" for="tensionMeter">轻拉 · 观察 · 松绳</label><meter id="tensionMeter" min="0" max="1" low=".22" high=".7" optimum=".45" value="0">牵引绳张力</meter></div><button id="leashControl" class="quiet-button" type="button" aria-describedby="message">轻拉一下 <span aria-hidden="true">↖</span></button></div>
<p id="message" class="message" role="status" aria-live="polite">按住牵引绳向左轻拉，放松一点，再松手。</p>
<div class="result" id="result" hidden><h2 id="resultTitle"></h2><p id="resultDetail"></p></div>
<button id="restart" class="quiet-button restart" type="button" hidden>再走一圈 ↻</button>
<footer>不着急。散步的意义，是一起走。</footer>
</section></main>
<script src="mechanics.js"></script><script src="frames.js"></script><script src="game.js"></script>
</body></html>
