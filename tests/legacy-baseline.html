<!-- Historical baseline 0c1511e, preserved only for reproducible comparison. -->
<!doctype html>
<html lang="zh-CN">
  <head><base href="../">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小柴的散步谈判</title>
    <meta name="description" content="一只很难被说服去散步的柴犬。" />
    <style>:root {
  --paper: #fbf7ec;
  --rail: rgba(117, 78, 43, .13);
  --fill: .035;
}

* { box-sizing: border-box; }
html, body { min-width: 320px; min-height: 100%; margin: 0; background: var(--paper); }
body { min-height: 100vh; }
button { font: inherit; }

.toy-shell {
  display: grid;
  min-height: 100vh;
  place-items: center;
  padding: clamp(16px, 4vw, 68px);
  background: radial-gradient(circle at 28% 8%, #fffdf8 0 13%, transparent 42%), var(--paper);
}
.toy { width: min(1280px, 100%); }
.stage {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  aspect-ratio: 3 / 1;
  border-radius: clamp(14px, 2vw, 28px);
  background: #fdf8ed;
  box-shadow: 0 20px 60px rgba(111, 75, 34, .07), inset 0 1px rgba(255,255,255,.9);
}
.cel-viewport { position: absolute; inset: 0; overflow: hidden; background: #fdf8ed; }
.cel {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transform: translate3d(0, 0, 0);
  will-change: opacity, transform;
}
.cel-current { z-index: 2; opacity: 1; }
.cel-previous { z-index: 1; }
.stage.is-dragging .cel-current { transform: translate3d(calc(var(--scene-sway, 0px) * -.18), 0, 0) scale(1.003); }
.stage.is-resetting .cel-previous { opacity: 1; }
.stage.is-resetting .cel-current { animation: scene-reset .34s ease-out both; }

.hit-layer { position: absolute; z-index: 4; inset: 0; width: 100%; height: 100%; overflow: visible; }
.rope-hit { fill: none; stroke: #fff; stroke-opacity: .001; stroke-width: 82; stroke-linecap: round; pointer-events: stroke; cursor: grab; touch-action: none; }
.rope-hit:active { cursor: grabbing; }
.stage.is-locked .rope-hit { pointer-events: none; }
.leash-control { position: absolute; z-index: 5; top: 50%; left: 40%; width: 1px; height: 1px; padding: 0; border: 0; opacity: 0; }
.leash-control:focus-visible { width: 30px; height: 30px; opacity: 1; outline: 2px solid rgba(237, 141, 66, .72); outline-offset: 5px; border-radius: 50%; transform: translate(-50%, -50%); }

.grab-cue {
  --cue-x: 22.6%;
  --cue-y: 49%;
  --cue-scale: 1;
  position: absolute;
  z-index: 6;
  left: var(--cue-x);
  top: var(--cue-y);
  width: clamp(30px, 4.2vw, 52px);
  aspect-ratio: 1;
  pointer-events: none;
  opacity: 0;
  transform: translate(-50%, -50%) translate3d(var(--cue-shift, 0px), 0, 0) scale(var(--cue-scale));
  transform-origin: 50% 58%;
  transition: opacity .16s ease, transform .1s linear;
}
.grab-cue svg { position: relative; z-index: 2; display: block; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 2px 2px rgba(92, 48, 23, .2)); }
.cue-hand { fill: #ffe4be; stroke: #633c26; stroke-width: 2.15; stroke-linejoin: round; }
.cue-line, .cue-motion { fill: none; stroke: #d76a30; stroke-width: 2.4; stroke-linecap: round; }
.cue-motion { opacity: .76; }
.grab-ripple { position: absolute; z-index: 1; inset: 21%; border: 2px solid rgba(221, 108, 43, .58); border-radius: 50%; opacity: 0; transform: scale(.4); }
.stage.is-hovering .grab-cue, .stage.is-dragging .grab-cue { opacity: 1; }
.stage.is-hovering .grab-cue { animation: cue-float 1.25s ease-in-out infinite; }
.stage.is-hovering .ripple-one { animation: cue-ripple 1.3s ease-out infinite; }
.stage.is-hovering .ripple-two { animation: cue-ripple 1.3s .46s ease-out infinite; }
.stage.is-dragging .grab-cue { --cue-scale: calc(1 + var(--grab-tightness, 0) * .1); }
.stage.is-dragging .cue-hand { fill: #ffd29e; }
.stage.is-dragging .cue-line { stroke-width: calc(2.4px + var(--grab-tightness, 0) * 1.5px); }
.stage.is-dragging .ripple-one { animation: cue-ripple .72s ease-out infinite; }
.stage.is-dragging .ripple-two { animation: cue-ripple .72s .24s ease-out infinite; }

.fluid-progress { position: relative; width: min(82%, 740px); height: 13px; margin: clamp(18px, 3.2vw, 34px) auto 0; }
.fluid-track {
  position: absolute;
  inset: 3px 0;
  overflow: hidden;
  border-radius: 999px;
  background: var(--rail);
  box-shadow: inset 0 1px 2px rgba(92, 55, 27, .08), 0 1px rgba(255,255,255,.72);
}
.fluid-fill {
  position: absolute;
  inset: 0;
  width: 100%;
  border-radius: inherit;
  background: linear-gradient(105deg, #cf6125 0%, #f28b45 19%, #ffd4a1 39%, #ffe8c9 52%, #f6a25d 66%, #df722d 82%, #ffdcb2 100%);
  background-size: 260% 100%;
  box-shadow: 0 0 13px rgba(235, 136, 59, .36), inset 0 1px rgba(255,255,255,.68);
  transform: scaleX(var(--fill));
  transform-origin: left center;
  transition: transform .36s cubic-bezier(.18,.85,.22,1.1);
  animation: morpheus-flow 4.8s linear infinite;
}
.fluid-progress.is-pulling .fluid-fill { transition-duration: .14s; transform: scaleX(var(--pull-fill)); }
.fluid-progress.is-dragging .fluid-fill { transition: none; transform: scaleX(var(--drag-fill)); filter: saturate(calc(1 + var(--drag-energy, 0) * .28)) brightness(calc(1 + var(--drag-energy, 0) * .12)); }
.fluid-progress.is-complete .fluid-fill { animation: morpheus-flow 2.4s linear infinite, completion-breathe .75s ease-in-out infinite alternate; }

.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

@keyframes morpheus-flow { to { background-position: 260% 0; } }
@keyframes completion-breathe { from { filter: brightness(1); } to { filter: brightness(1.15) saturate(1.12); } }
@keyframes scene-reset { from { opacity: 0; } to { opacity: 1; } }
@keyframes cue-float { 0%, 100% { transform: translate(-50%, -50%) translate3d(0, 0, 0) scale(1); } 50% { transform: translate(-50%, -50%) translate3d(-4px, -2px, 0) scale(1.05); } }
@keyframes cue-ripple { 0% { opacity: .72; transform: scale(.42); } 100% { opacity: 0; transform: scale(1.7); } }

@media (max-width: 620px) {
  .toy-shell { padding: 12px; }
  .stage { border-radius: 14px; }
  .fluid-progress { width: 88%; height: 11px; margin-top: 16px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
  </head>
  <body>
    <main class="toy-shell">
      <section class="toy" aria-label="小柴拉绳小游戏">
        <div class="stage" id="stage" data-state="idle" data-chapter="1">
          <div class="cel-viewport" id="celViewport">
            <img class="cel cel-previous" id="celPrevious" alt="" aria-hidden="true" />
            <img class="cel cel-current" id="celCurrent" alt="一只柴犬固执地站在牵引绳另一端。" />
            <svg class="hit-layer" viewBox="0 0 1536 512" preserveAspectRatio="none" aria-hidden="true">
              <path id="ropeHit" class="rope-hit" d="M 305 265 C 560 370, 795 373, 1050 297" />
            </svg>
            <div class="grab-cue" id="grabCue" aria-hidden="true">
              <i class="grab-ripple ripple-one"></i><i class="grab-ripple ripple-two"></i>
              <svg viewBox="0 0 52 52" focusable="false">
                <path class="cue-motion" d="M8 19c-3 4-3 10 0 14M14 14c-5 6-5 17 0 24" />
                <path class="cue-hand" d="M25 43c-7 0-12-5-12-12v-7c0-2 2-3 4-1l4 4V13c0-3 5-3 5 0v12-15c0-3 5-3 5 0v15-12c0-3 5-3 5 0v14-9c0-3 5-3 5 0v14c0 7-5 11-12 11Z" />
                <path class="cue-line" d="M21 27h20" />
              </svg>
            </div>
          </div>
          <button class="leash-control" id="leashControl" type="button" aria-describedby="tugHint">
            <span class="sr-only">轻拉牵引绳</span>
          </button>
          <p id="tugHint" class="sr-only">可点击或拖动画中的牵引绳，也可按空格或回车推进。</p>
        </div>
        <div class="fluid-progress" id="fluidProgress" aria-hidden="true">
          <div class="fluid-track"><div class="fluid-fill"></div></div>
        </div>
      </section>
    </main>
    <script>(() => {
  const stage = document.querySelector('#stage');
  const currentCel = document.querySelector('#celCurrent');
  const previousCel = document.querySelector('#celPrevious');
  const ropeHit = document.querySelector('#ropeHit');
  const leashControl = document.querySelector('#leashControl');
  const fluidProgress = document.querySelector('#fluidProgress');
  const grabCue = document.querySelector('#grabCue');
  const PAUSE = (ms) => new Promise((resolve) => window.setTimeout(resolve, ms));
  const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const VALID_DRAG = .04;
  const FULL_DRAG = .22;
  const MIN_BAR = .035;

  const NAMES = ['idle', 'hover', 'takeup', 'pull', 'tight-1', 'brace', 'tight-2', 'crouch-1', 'crouch-2', 'reactionA', 'reactionB', 'turn-1', 'turn', 'turn-2', 'refusal', 'return', 'slide-1', 'slide', 'replant', 'settled'];
  const pathFor = (chapter, name) => {
    const endX = [1060, 1015, 970][chapter];
    const isLoose = ['idle', 'hover', 'takeup', 'settled', 'replant'].includes(name);
    const startY = 242;
    const endY = name === 'refusal' ? 338 : 298;
    const sag = isLoose ? 105 : 22;
    return `M 347 ${startY} C 575 ${startY + sag}, ${endX - 235} ${endY + sag}, ${endX} ${endY}`;
  };
  const sourceFor = (chapter, name) => {
    const filePrefix = `ch${chapter + 1}`;
    const fileName = name.replace('reactionA', 'reaction-a').replace('reactionB', 'reaction-b');
    return `assets/cels/frames/${filePrefix}-${fileName}.webp`;
  };
  const CELS = [0, 1, 2].map((chapter) => Object.fromEntries(NAMES.map((name) => [name, {
    id: `ch${chapter + 1}-${name}`,
    src: sourceFor(chapter, name),
    hitPath: pathFor(chapter, name)
  }])));

  let state = 'idle';
  let chapter = 0;
  let storedProgress = 0;
  let currentId = '';
  let drag = null;
  let queuedDrag = null;
  let dragRaf = 0;
  let reactionCursor = 0;
  const preloadCache = new Map();

  function setState(next) {
    state = next;
    stage.dataset.state = next;
    stage.dataset.chapter = String(chapter + 1);
    stage.classList.toggle('is-locked', !['idle', 'dragging'].includes(next));
    leashControl.disabled = next !== 'idle';
  }

  function preload(src) {
    if (preloadCache.has(src)) return preloadCache.get(src);
    const task = new Promise((resolve) => {
      const image = new Image();
      image.onload = () => resolve(true);
      image.onerror = () => resolve(false);
      image.src = src;
    });
    preloadCache.set(src, task);
    return task;
  }

  function preloadChapter(index) {
    NAMES.forEach((name) => preload(CELS[index][name].src));
  }

  function displayProgress(value) {
    return MIN_BAR + (1 - MIN_BAR) * Math.max(0, Math.min(1, value));
  }

  function setProgress(value) {
    fluidProgress.style.setProperty('--fill', String(displayProgress(value)));
  }

  function showNow(frame) {
    ropeHit.setAttribute('d', frame.hitPath);
    if (currentId !== frame.id) {
      currentCel.src = frame.src;
      currentId = frame.id;
    }
  }

  async function showFrame(frame, hold = 105, fade = false) {
    if (!(await preload(frame.src))) return false;
    if (currentId !== frame.id) {
      if (fade && currentCel.getAttribute('src')) {
        previousCel.src = currentCel.src;
        currentCel.src = frame.src;
        currentId = frame.id;
        ropeHit.setAttribute('d', frame.hitPath);
        stage.classList.add('is-resetting');
        await new Promise((resolve) => requestAnimationFrame(resolve));
        await PAUSE(REDUCED ? 20 : 250);
        stage.classList.remove('is-resetting');
      } else {
        showNow(frame);
        await new Promise((resolve) => requestAnimationFrame(resolve));
      }
    }
    await PAUSE(REDUCED ? 24 : hold);
    return true;
  }

  async function play(names, hold = 92) {
    for (const name of names) {
      if (!(await showFrame(CELS[chapter][name], hold))) return false;
    }
    return true;
  }

  function updateCuePosition(clientX, clientY) {
    const bounds = stage.getBoundingClientRect();
    grabCue.style.setProperty('--cue-x', `${Math.max(0, Math.min(bounds.width, clientX - bounds.left))}px`);
    grabCue.style.setProperty('--cue-y', `${Math.max(0, Math.min(bounds.height, clientY - bounds.top))}px`);
  }

  function tensionFor(clientX, startX) {
    const width = stage.getBoundingClientRect().width;
    const distance = Math.max(0, startX - clientX);
    const validDistance = width * VALID_DRAG;
    const fullDistance = width * FULL_DRAG;
    if (distance < validDistance) return { distance, tension: 0, valid: false };
    return { distance, tension: Math.min(1, (distance - validDistance) / (fullDistance - validDistance)), valid: true };
  }

  function gainFor(tension) {
    return .035 + .105 * Math.pow(tension, .85);
  }

  function frameForTension(tension, variant) {
    if (tension < .08) return 'hover';
    if (tension < .18) return 'takeup';
    if (tension < .28) return 'pull';
    if (tension < .38) return 'tight-1';
    if (tension < .48) return 'brace';
    if (tension < .58) return 'tight-2';
    if (tension < .66) return 'crouch-1';
    if (tension < .74) return 'crouch-2';
    if (tension < .80) return variant;
    if (tension < .86) return 'turn-1';
    if (tension < .92) return 'turn';
    if (tension < .97) return 'turn-2';
    return 'refusal';
  }

  function setHover(event) {
    if (state !== 'idle') return;
    updateCuePosition(event.clientX, event.clientY);
    stage.classList.add('is-hovering');
    showNow(CELS[chapter].hover);
  }

  function clearHover() {
    if (state !== 'idle') return;
    stage.classList.remove('is-hovering');
    showNow(CELS[chapter].idle);
  }

  function applyDrag(clientX, clientY) {
    if (!drag || state !== 'dragging') return;
    const pull = tensionFor(clientX, drag.startX);
    drag.distance = pull.distance;
    drag.tension = pull.tension;
    drag.valid = pull.valid;
    drag.preview = frameForTension(pull.tension, drag.variant);
    updateCuePosition(clientX, clientY);
    stage.style.setProperty('--grab-tightness', String(pull.tension));
    stage.style.setProperty('--scene-sway', `${Math.min(10, pull.distance * .055)}px`);
    grabCue.style.setProperty('--cue-shift', `${-Math.min(18, pull.distance * .08)}px`);
    const previewProgress = pull.valid ? Math.min(1, storedProgress + gainFor(pull.tension)) : storedProgress;
    fluidProgress.style.setProperty('--drag-fill', String(displayProgress(previewProgress)));
    fluidProgress.style.setProperty('--drag-energy', String(pull.tension));
    showNow(CELS[chapter][drag.preview]);
  }

  function queueDrag(clientX, clientY) {
    queuedDrag = [clientX, clientY];
    if (dragRaf) return;
    dragRaf = requestAnimationFrame(() => {
      dragRaf = 0;
      if (queuedDrag) applyDrag(...queuedDrag);
    });
  }

  function stopDragging() {
    if (dragRaf) cancelAnimationFrame(dragRaf);
    dragRaf = 0;
    queuedDrag = null;
    stage.classList.remove('is-dragging');
    stage.style.removeProperty('--grab-tightness');
    stage.style.removeProperty('--scene-sway');
    grabCue.style.removeProperty('--cue-shift');
    fluidProgress.classList.remove('is-dragging');
    fluidProgress.style.removeProperty('--drag-fill');
    fluidProgress.style.removeProperty('--drag-energy');
  }

  function settleFrames(preview, variant, crossedMilestone) {
    const tensionPath = ['hover', 'takeup', 'pull', 'tight-1', 'brace', 'tight-2', 'crouch-1', 'crouch-2', variant, 'turn-1', 'turn', 'turn-2', 'refusal'];
    const currentIndex = Math.max(0, tensionPath.indexOf(preview));
    if (crossedMilestone) {
      return [...tensionPath.slice(currentIndex + 1), 'return', 'slide-1', 'slide', 'replant'];
    }
    if (preview === 'refusal') return ['return', 'settled'];
    if (['turn-1', 'turn', 'turn-2'].includes(preview)) return [...tensionPath.slice(currentIndex + 1), 'return', 'settled'];
    if (preview === 'reactionA' || preview === 'reactionB') return ['settled'];
    return [tensionPath[Math.min(currentIndex + 1, tensionPath.length - 1)], 'settled'];
  }

  async function resetAfterComplete() {
    await PAUSE(REDUCED ? 160 : 1500);
    fluidProgress.classList.remove('is-complete');
    chapter = 0;
    storedProgress = 0;
    setProgress(storedProgress);
    await showFrame(CELS[0].idle, 100, true);
    setState('idle');
  }

  async function commitPull({ tension = .6, preview = 'brace', variant = 'reactionA', valid = true } = {}) {
    if (state !== 'idle') return;
    if (!valid) {
      showNow(CELS[chapter].idle);
      return;
    }

    const before = storedProgress;
    const beforeChapter = Math.min(2, Math.floor(before * 3));
    storedProgress = Math.min(1, before + gainFor(tension));
    const afterChapter = Math.min(3, Math.floor(storedProgress * 3));
    const crossedMilestone = afterChapter > beforeChapter || storedProgress === 1;
    setProgress(storedProgress);
    setState('settling');
    await play(settleFrames(preview, variant, crossedMilestone), crossedMilestone ? 118 : 82);

    if (crossedMilestone) {
      if (afterChapter === 3) {
        fluidProgress.classList.add('is-complete');
        setState('complete');
        resetAfterComplete();
        return;
      }
      chapter = afterChapter;
      preloadChapter(chapter);
      await showFrame(CELS[chapter].idle, 90, true);
    }
    setState('idle');
  }

  function beginPointer(event) {
    if (state !== 'idle') return;
    stage.classList.remove('is-hovering');
    const variant = reactionCursor % 2 === 0 ? 'reactionA' : 'reactionB';
    drag = { startX: event.clientX, pointerId: event.pointerId, tension: 0, valid: false, preview: 'hover', variant };
    setState('dragging');
    stage.classList.add('is-dragging');
    fluidProgress.classList.add('is-dragging');
    updateCuePosition(event.clientX, event.clientY);
    ropeHit.setPointerCapture?.(event.pointerId);
    applyDrag(event.clientX, event.clientY);
  }

  function movePointer(event) {
    if (!drag || event.pointerId !== drag.pointerId) return;
    queueDrag(event.clientX, event.clientY);
  }

  function endPointer(event) {
    if (!drag || event.pointerId !== drag.pointerId) return;
    ropeHit.releasePointerCapture?.(event.pointerId);
    applyDrag(event.clientX, event.clientY);
    const result = { tension: drag.tension, preview: drag.preview, variant: drag.variant, valid: drag.valid };
    if (result.valid) reactionCursor += 1;
    drag = null;
    stopDragging();
    setState('idle');
    commitPull(result);
  }

  function cancelPointer(event) {
    if (!drag || (event && event.pointerId !== drag.pointerId)) return;
    drag = null;
    stopDragging();
    setState('idle');
    showNow(CELS[chapter].idle);
  }

  ropeHit.addEventListener('pointerdown', beginPointer);
  ropeHit.addEventListener('pointermove', movePointer);
  ropeHit.addEventListener('pointerup', endPointer);
  ropeHit.addEventListener('pointercancel', cancelPointer);
  ropeHit.addEventListener('pointerenter', setHover);
  ropeHit.addEventListener('pointerleave', clearHover);
  leashControl.addEventListener('click', (event) => { event.preventDefault(); commitPull(); });
  leashControl.addEventListener('keydown', (event) => {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    event.preventDefault();
    commitPull();
  });

  setProgress(storedProgress);
  showNow(CELS[0].idle);
  setState('idle');
  CELS.forEach((_, index) => preloadChapter(index));
})();
</script>
  </body>
</html>
